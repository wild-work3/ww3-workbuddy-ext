name: release

# 打 tag（v*）即发布 Windows 版插件包，并把「契约符合性 + 能力矩阵」自动提到注册表仓。
#
# 流水线四步（用户 m03392）：构建二进制 → 下载最新版 conformance 二进制 →
# 验证契约/能力 → 自动生成插件注册 json 并提 PR 到注册表仓。
# 本轮只做 Windows amd64（用户 m03447：先把流程闭环，再推广全平台）。
#
# 需要 secret（缺省时该步只打 notice 跳过，不阻断发布——准入摘要属可选信息）：
#   REGISTRY_TOKEN  wild-work3 组织内有 repo 权限的 PAT（用于向 ww3-ext-registry 提 PR）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/补传的 tag（缺省用当前 ref 的 tag）'
        required: false

permissions:
  contents: write

env:
  PLUGIN_REPO: https://github.com/wild-work3/ww3-workbuddy-ext
  REGISTRY_REPO: wild-work3/ww3-ext-registry
  CONFORMANCE_URL: https://github.com/wild-work3/ww3-conformance/releases/latest/download/ww3-conformance-windows-amd64.exe

jobs:
  release:
    runs-on: windows-latest
    env:
      # secrets 不能直接写在 step 的 if 里（if 不支持 secrets 上下文），先落到 env 再判空
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # make_registry_entry.py 只用标准库，但别赌 runner 默认版本

      - name: 构建插件包
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh --zip
          id=$(sed -n 's/.*"id":[[:space:]]*"\([^"]*\)".*/\1/p' dist/manifest.json | head -1)
          ver=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' dist/manifest.json | head -1)
          echo "PLUGIN_ID=$id"   >> "$GITHUB_ENV"
          echo "PLUGIN_VER=$ver" >> "$GITHUB_ENV"
          echo "ZIP=dist/$id-$ver.zip" >> "$GITHUB_ENV"
          sha256sum "dist/$id-$ver.zip" | tee "dist/$id-$ver.zip.sha256"

      - name: 发布 release（幂等，可重跑补传）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "${PLUGIN_ID} ${PLUGIN_VER}"
          gh release upload "$tag" "$ZIP" "$ZIP.sha256" dist/workbuddy-ext.exe --clobber

      # 以下三步都允许失败：注册表只强制 repo/version/file/sha256，
      # 准入摘要是「锦上添花」，跑不通不该挡住已经发布的二进制。
      - name: 下载 conformance 二进制
        id: confdl
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o ww3-conformance.exe "$CONFORMANCE_URL"
          ./ww3-conformance.exe --help >/dev/null
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: 验证契约与能力（B 层，全打本地 mock，零真实上游）
        id: confrun
        if: steps.confdl.outputs.ok == '1'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          ./ww3-conformance.exe --exe dist/workbuddy-ext.exe --descriptor conformance.json \
            --id workbuddy --out conformance-report \
            --json-summary conformance-summary.json --print-snippet
          # 退出码 0=PASS/WARN，1=有 FAIL。FAIL 时不让它静默通过，但也只降级为告警：
          # 判定与阻断交给插件作者（用户 m02729：本工具不是门禁）。
          echo "=== 摘要 ==="
          cat conformance-summary.json

      - name: 生成注册表条目
        shell: bash
        run: |
          set -euo pipefail
          sum=""
          [ -f conformance-summary.json ] && sum="--summary conformance-summary.json"
          python scripts/make_registry_entry.py \
            --manifest dist/manifest.json \
            --zip "$ZIP" \
            --repo "$PLUGIN_REPO" \
            --os windows --arch amd64 \
            $sum \
            --out .registry/"$PLUGIN_ID".json
          cat .registry/"$PLUGIN_ID".json

      - name: 提 PR 到注册表仓
        if: env.REGISTRY_TOKEN != ''
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          branch="plugin/${PLUGIN_ID}-${PLUGIN_VER}"

          # 注册表是平铺文件仓：一个插件一个文件，PR 互不相干（W3-48）
          rm -rf registry && git clone --depth 1 "https://x-access-token:${REGISTRY_TOKEN}@github.com/${REGISTRY_REPO}.git" registry
          # 以仓里现有条目为基底做 upsert，保住人工维护的 gateway 门与历史 versions
          base=registry/"$PLUGIN_ID".json

          python scripts/make_registry_entry.py \
            --manifest dist/manifest.json --zip "$ZIP" --repo "$PLUGIN_REPO" \
            --os windows --arch amd64 \
            $( [ -f conformance-summary.json ] && echo --summary conformance-summary.json ) \
            --base "$base" --out "$base"

          cd registry
          if git diff --quiet -- "$PLUGIN_ID".json; then
            echo "注册表条目无变化，跳过 PR"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$PLUGIN_ID".json
          git commit -m "update: ${PLUGIN_ID} ${PLUGIN_VER}"
          git push -f origin "$branch"
          summary_state="未附（未跑成功，不影响安装）"
          [ -f conformance-summary.json ] && summary_state="已附"
          {
            echo "由 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} 自动生成。"
            echo
            echo "- plugin: \`${PLUGIN_ID}\`"
            echo "- version: \`${PLUGIN_VER}\`"
            echo "- 准入摘要: ${summary_state}（注册表该字段可选，不影响安装）"
          } > pr-body.md
          gh pr create --repo "$REGISTRY_REPO" --base main --head "$branch" \
            --title "update: ${PLUGIN_ID} ${PLUGIN_VER}" \
            --body-file pr-body.md \
            || echo "PR 已存在或创建失败，分支 $branch 已更新"
